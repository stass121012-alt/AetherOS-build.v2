
name: Build AETHER OS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Extract project
        run: unzip -q AetherOS-v0.9.zip -d source

      - name: Build APK
        run: gradle -p source/AetherOS assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-OS-APK
          path: source/AetherOS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
